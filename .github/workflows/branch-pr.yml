name: Branch to Pull Request

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate-and-open-pr:
    name: Validate branch and create PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run branch tests
        run: python -m pytest --env AWS

      - name: Create or update pull request
        id: pull-request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const existing = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
              base: 'main'
            });
            let pullRequest = existing[0];
            if (!pullRequest) {
              const response = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: branch,
                base: 'main',
                title: `Automation: ${branch}`,
                body: [
                  '## Automated pull request',
                  '',
                  'This PR was created automatically after a successful branch test run.',
                  '',
                  '### Review checklist',
                  '- [ ] Copilot review completed',
                  '- [ ] CI checks are green',
                  '- [ ] No secrets or generated artifacts are included'
                ].join('\n')
              });
              pullRequest = response.data;
            }
            core.setOutput('pull-request-number', pullRequest.number);
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              labels: ['automation', 'copilot-review']
            });
            const marker = '<!-- copilot-review-request -->';
            const body = `${marker}\n@github-copilot Please review this pull request for correctness, Playwright reliability, POM boundaries, Excel test-data usage, and missing tests. Report findings before merge.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              per_page: 100
            });
            if (!comments.some(comment => comment.body && comment.body.includes(marker))) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                body
              });
            }
            try {
              await github.graphql(`
                mutation($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: SQUASH
                  }) {
                    pullRequest { number }
                  }
                }
              `, { pullRequestId: pullRequest.node_id });
            } catch (error) {
              core.warning(`Auto-merge was not enabled. Enable repository auto-merge and branch protection first: ${error.message}`);
            }
